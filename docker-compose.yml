services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-koyla}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d koyla"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/koyla
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_change_in_production_1234567890}
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-sentence_transformers}
      - NEURAL_MODEL_NAME=BAAI/bge-small-en-v1.5
      - NEURAL_MODEL_PATH=/app/model_cache/BAAI/bge-small-en-v1.5
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=SmolLM2-135M-Instruct
      - LOCAL_MODEL_PATH=/app/model_cache/SmolLM2-135M-Instruct
      - LOCAL_MODEL_NAME=SmolLM2-135M-Instruct
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - OFFLINE_MODE=${OFFLINE_MODE:-0}
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./backend/model_cache:/app/model_cache:ro
      - reports_data:/app/data/reports
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python scripts/migrate.py &&
             python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/koyla
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_change_in_production_1234567890}
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-sentence_transformers}
      - NEURAL_MODEL_NAME=BAAI/bge-small-en-v1.5
      - NEURAL_MODEL_PATH=/app/model_cache/BAAI/bge-small-en-v1.5
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=SmolLM2-135M-Instruct
      - LOCAL_MODEL_PATH=/app/model_cache/SmolLM2-135M-Instruct
      - LOCAL_MODEL_NAME=SmolLM2-135M-Instruct
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - OFFLINE_MODE=${OFFLINE_MODE:-0}
    volumes:
      - ./storage:/app/storage
      - ./backend/model_cache:/app/model_cache:ro
      - reports_data:/app/data/reports
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "celery -A app.core.celery_app worker --beat --loglevel=info --concurrency=2"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
  reports_data:
    driver: local
  hf_cache:
    driver: local
